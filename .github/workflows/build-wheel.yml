name: Build ROCm Wheel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PATH: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rocm/pytorch:rocm7.2_ubuntu24.04_py3.12_pytorch_release_2.8.0

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            rocthrust-dev miopen-hip-dev
          pip install setuptools wheel

      - name: Verify ROCm torch
        run: |
          python -c "
          import torch
          print('PyTorch:', torch.__version__)
          print('HIP:', torch.version.hip)
          is_rocm = hasattr(torch.version, 'hip') and torch.version.hip is not None
          print('IS_ROCM:', is_rocm)
          assert is_rocm, 'torch.version.hip not available!'
          "

      - name: Build wheel
        run: |
          pip wheel . --no-deps --no-build-isolation -w dist/
          ls -lh dist/

      - name: Verify .so in wheel
        run: |
          python -c "
          import zipfile, os
          whl = next(f for f in os.listdir('dist') if f.endswith('.whl'))
          print('Wheel:', whl)
          z = zipfile.ZipFile(f'dist/{whl}')
          sos = [n for n in z.namelist() if n.endswith('.so')]
          print('SO files:', sos)
          assert sos, 'No .so compiled in wheel!'
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: miopen-conv-fix-rocm72-wheel
          path: dist/miopen_conv_fix*.whl

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/miopen_conv_fix*.whl
          generate_release_notes: true
